# The check below returned 442 changed lines in ai_native_sdlc_maturity_
# model.md and 8 in shared_intelligence_layer.md, so the re-verification it
# demands was actually performed -- per cell, not per file:
#   * all 65 cells parsed at both commits and compared individually
