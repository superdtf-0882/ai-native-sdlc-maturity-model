# The compression is still faithful. No cell text is changed here. What
# was stale was the citation, not the thing it cites.
#
# THE CHECK NOW CITES source_matrix_commit AND NOT THE TAG. As originally
# written it hardcoded v1.2.0, so once any commit landed past that tag it
